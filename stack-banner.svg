text{white-space:pre}
.t1{fill:#1d6b57}.t2{fill:#3fae8f}.t3{fill:#8ff7d4}.t4{fill:#e8fff7}
.t3,.t4{fill:#8ff7d4}
.ln{opacity:0;animation:entra .4s steps(4) forwards}
@keyframes entra{to{opacity:1}}
